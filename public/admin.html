<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - O'Tacos Loyalty</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #16a34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0 0 6px 0;
            font-size: 1.6rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        button {
            padding: 12px 6px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            background-color: var(--primary);
            color: #fff;
        }

        button:hover { background-color: var(--primary-dark); }

        .status-msg {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            font-weight: 500;
            text-align: center;
        }

        .status-success { background-color: #14532d; color: #4ade80; }
        .status-error { background-color: #7f1d1d; color: #fca5a5; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th { color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>O'Tacos Admin Portal</h1>
        <p style="margin:0; color: var(--text-muted); font-size: 0.85rem;">Scan QR or Enter Client Phone Number</p>
    </div>

    <!-- Scanner -->
    <div class="card">
        <h2>📷 QR Scanner</h2>
        <div id="reader"></div>
    </div>

    <!-- Add Points Section -->
    <div class="card">
        <h2>🌮 Add Loyalty Points</h2>
        
        <div class="form-group">
            <label for="phone">Client Phone Number (77XXXXXX)</label>
            <input 
                type="tel" 
                id="phone" 
                placeholder="77123456" 
                pattern="^77\d{6}$" 
                maxlength="8" 
                minlength="8" 
                inputmode="numeric" 
                required
            >
        </div>

        <div class="btn-grid">
            <button onclick="updatePoints(10)">+10 Points<br><small>(Tacos)</small></button>
            <button onclick="updatePoints(5)">+5 Points<br><small>(Burger/Panini)</small></button>
            <button onclick="updatePoints(2)">+2 Points<br><small>(Breakfast)</small></button>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- Registered Clients Table -->
    <div class="card">
        <h2>📋 Registered Clients</h2>
        <input type="text" id="searchInput" placeholder="Search phone..." onkeyup="filterTable()" style="margin-bottom: 10px;">
        <table>
            <thead>
                <tr>
                    <th>Phone</th>
                    <th>Total Points</th>
                </tr>
            </thead>
            <tbody id="clientTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const phoneInput = document.getElementById('phone');
    const statusMsg = document.getElementById('statusMsg');

    async function loadClients() {
        try {
            const res = await fetch('/api/clients');
            if (res.ok) {
                const clients = await res.json();
                const tableBody = document.getElementById('clientTableBody');
                tableBody.innerHTML = clients.map(c => `
                    <tr>
                        <td>${c.phone}</td>
                        <td><strong>${c.points} pts</strong></td>
                    </tr>
                `).join('');
            }
        } catch (err) {
            console.error("Failed to fetch clients", err);
        }
    }

    async function updatePoints(delta) {
        const phone = phoneInput.value.trim();
        const phoneRegex = /^77\d{6}$/;

        if (!phoneRegex.test(phone)) {
            showStatus('Phone must be 8 digits starting with 77 (e.g. 77123456)', false);
            return;
        }

        try {
            const res = await fetch('/api/points', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, delta })
            });

            const data = await res.json();
            if (res.ok) {
                showStatus(`Success! ${phone} now has ${data.points} points.`, true);
                loadClients();
            } else {
                showStatus(data.error || 'Failed to update points', false);
            }
        } catch (err) {
            showStatus('Network error. Check connection.', false);
        }
    }

    function showStatus(text, isSuccess) {
        statusMsg.innerText = text;
        statusMsg.className = `status-msg ${isSuccess ? 'status-success' : 'status-error'}`;
        statusMsg.style.display = 'block';
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#clientTableBody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
        });
    }

    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render((decodedText) => {
        const cleanText = decodedText.trim().replace(/\D/g, '');
        if (cleanText.length >= 8) {
            const matchedPhone = cleanText.slice(-8);
            phoneInput.value = matchedPhone;
            showStatus(`Scanned client: ${matchedPhone}`, true);
        } else {
            phoneInput.value = decodedText;
        }
    });

    loadClients();
</script>
</body>
</html>
