<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'TACOS - Espace Admin</title>
  <link rel="shortcut icon" href="otacoslogo.png" type="image/png">
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0d131d; color: #fff; margin: 0; padding: 20px; }
    
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #ff6600; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; }
    .header-left img { height: 50px; margin-right: 15px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .role-select { background: #192231; color: #ff6600; border: 1px solid #ff6600; padding: 8px 12px; border-radius: 8px; font-weight: bold; }

    .block { background: #192231; border: 1px solid #2c384a; border-radius: 16px; padding: 20px; margin-bottom: 25px; }
    .block h3 { color: #ff6600; margin-top: 0; border-bottom: 1px solid #2c384a; padding-bottom: 10px; }

    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2c384a; background: #111722; color: #fff; margin-bottom: 12px; font-size: 15px; }
    
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    button { padding: 12px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-main { background: #ff6600; color: #fff; }
    .btn-add { background: #28a745; color: #fff; }
    .btn-remove { background: #dc3545; color: #fff; }
    .btn-convert { background: #ff6600; color: #fff; width: 100%; font-size: 16px; margin-top: 15px; }
    .btn-login { background: #ff6600; color: #fff; padding: 8px 14px; }
    .btn-logout { background: #6c757d; color: #fff; padding: 8px 14px; }

    #reader { width: 100%; max-width: 320px; margin: 10px auto; border-radius: 12px; overflow: hidden; display: none; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #2c384a; padding: 12px; text-align: left; }
    th { background: #111722; color: #ff6600; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="otacoslogo.png" alt="O'Tacos Logo">
      <h2 style="margin:0;">Panneau Admin</h2>
    </div>
    
    <div class="header-right">
      <div>
        <label>Rôle : </label>
        <select id="roleSelect" class="role-select" onchange="handleRoleChange()">
          <option value="supervisor">Supervisor</option>
          <option value="manager">Manager</option>
        </select>
      </div>
      
      <!-- Manager Auth Status -->
      <div id="managerAuthBlock" style="display: none;">
        <span id="managerStatus" style="color: #28a745; font-weight: bold; margin-right: 5px;">🔒 Manager Connecté</span>
        <button class="btn-logout" onclick="logoutManager()">Déconnexion</button>
      </div>
    </div>
  </div>

  <!-- BLOCK 1 -->
  <div class="block">
    <h3>1. Enregistrer un Nouveau Client (1ère Visite!)</h3>
    <input type="text" id="newName" placeholder="Nom Complet (ex: Ahmed Ali Umar - min 3 mots)">
    <input type="text" id="newPhone" maxlength="8" placeholder="Numéro Téléphone (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    <button class="btn-main" onclick="registerClient()">Enregistrer le Client</button>
  </div>

  <!-- BLOCK 2 -->
  <div class="block">
    <h3>2. Scanner QR Code & Gérer les Points</h3>
    
    <div style="display:flex; gap: 10px;">
      <input type="text" id="searchPhone" maxlength="8" placeholder="Numéro Téléphone (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
      <button class="btn-main" onclick="searchClient()">Chercher</button>
    </div>
    
    <button onclick="toggleScanner()" style="background:#007bff; color:#fff; width:100%; margin-bottom:10px;">📷 Ouvrir Scanner Camera</button>
    <div id="reader"></div>

    <div id="clientDetails" style="display:none; margin-top: 20px; background: #111722; padding: 15px; border-radius: 12px;">
      <h4 style="margin-top:0; color:#fff;" id="clientTitle">Client: </h4>
      <p>Points Actuels : <strong id="currentPts" style="color:#ff6600; font-size: 22px;">0</strong> Pts</p>
      
      <p style="margin-bottom:5px; font-weight:bold;">Ajouter Points :</p>
      <div class="btn-group">
        <button class="btn-add" onclick="addPts(10)">Tacos (+10 Pts)</button>
        <button class="btn-add" onclick="addPts(5)">Burger/Panini (+5 Pts)</button>
        <button class="btn-add" onclick="addPts(10)">Breakfast (+10 Pts)</button>
      </div>

      <p style="margin-bottom:5px; font-weight:bold;">Retirer Points (Manager Uniquement) :</p>
      <div class="btn-group">
        <button class="btn-remove" onclick="removePts(10)">Retirer (-10 Pts)</button>
        <button class="btn-remove" onclick="removePts(5)">Retirer (-5 Pts)</button>
      </div>

      <button class="btn-convert" onclick="redeemPoints()">Convertir mes points</button>
    </div>
  </div>

  <!-- BLOCK 3 -->
  <div class="block">
    <h3>3. Liste des Clients</h3>
    <button onclick="loadClientsList()" style="background:#6c757d; color:#fff;">Rafraîchir la Liste</button>
    <table>
      <thead>
        <tr>
          <th>Nom Complet</th>
          <th>Téléphone</th>
          <th>Points</th>
          <th>Date de Création</th>
        </tr>
      </thead>
      <tbody id="clientsTableBody"></tbody>
    </table>
  </div>

  <script>
    let activeClient = null;
    let html5QrCode = null;

    function getRole() {
      return document.getElementById('roleSelect').value;
    }

    async function handleRoleChange() {
      const role = getRole();
      if (role === 'manager') {
        const loggedInPin = sessionStorage.getItem('managerPin');
        if (!loggedInPin) {
          await promptManagerLogin();
        } else {
          document.getElementById('managerAuthBlock').style.display = 'block';
        }
      } else {
        document.getElementById('managerAuthBlock').style.display = 'none';
      }
    }

    async function promptManagerLogin() {
      const pin = prompt('Connexion Manager : Veuillez entrer votre code PIN (4 chiffres)');
      if (!pin) {
        document.getElementById('roleSelect').value = 'supervisor';
        return false;
      }

      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      });

      const data = await res.json();
      if (res.ok) {
        sessionStorage.setItem('managerPin', pin);
        document.getElementById('managerAuthBlock').style.display = 'block';
        alert('Connexion réussie en tant que Manager !');
        return true;
      } else {
        alert(data.error);
        document.getElementById('roleSelect').value = 'supervisor';
        return false;
      }
    }

    function logoutManager() {
      sessionStorage.removeItem('managerPin');
      document.getElementById('roleSelect').value = 'supervisor';
      document.getElementById('managerAuthBlock').style.display = 'none';
      alert('Déconnecté du rôle Manager.');
    }

    async function registerClient() {
      const name = document.getElementById('newName').value;
      const phone = document.getElementById('newPhone').value;

      const res = await fetch('/api/clients/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone })
      });

      const data = await res.json();
      if (!res.ok) return alert(data.error);

      alert('Client enregistré avec succès!');
      document.getElementById('newName').value = '';
      document.getElementById('newPhone').value = '';
      loadClientsList();
    }

    async function searchClientByPhone(phone) {
      const res = await fetch(`/api/clients/${phone}`);
      if (!res.ok) {
        alert('Client introuvable.');
        return;
      }
      activeClient = await res.json();
      document.getElementById('clientDetails').style.display = 'block';
      document.getElementById('clientTitle').innerText = `Client: ${activeClient.name} (${activeClient.phone})`;
      document.getElementById('currentPts').innerText = activeClient.points;
    }

    function searchClient() {
      const phone = document.getElementById('searchPhone').value;
      if (phone.length !== 8) return alert('Entrez un numéro à 8 chiffres.');
      searchClientByPhone(phone);
    }

    async function addPts(pts) {
      if (!activeClient) return;
      const res = await fetch('/api/clients/add-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeClient.phone, pointsToAdd: pts })
      });
      const data = await res.json();
      if (res.ok) {
        activeClient = data.client;
        document.getElementById('currentPts').innerText = activeClient.points;
        loadClientsList();
      }
    }

    async function removePts(pts) {
      if (getRole() !== 'manager') {
        return alert('Seul le Manager est autorisé à retirer des points.');
      }
      
      let pin = sessionStorage.getItem('managerPin');
      if (!pin) {
        const success = await promptManagerLogin();
        if (!success) return;
        pin = sessionStorage.getItem('managerPin');
      }

      const res = await fetch('/api/clients/remove-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeClient.phone, pointsToRemove: pts, pin })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      activeClient = data.client;
      document.getElementById('currentPts').innerText = activeClient.points;
      loadClientsList();
    }

    async function redeemPoints() {
      if (!activeClient) return;

      const res = await fetch('/api/clients/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeClient.phone })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      alert(data.message);
      activeClient = data.client;
      document.getElementById('currentPts').innerText = activeClient.points;
      loadClientsList();
    }

    function toggleScanner() {
      const readerEl = document.getElementById('reader');
      if (readerEl.style.display === 'none') {
        readerEl.style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          (decodedText) => {
            html5QrCode.stop();
            readerEl.style.display = 'none';
            document.getElementById('searchPhone').value = decodedText;
            searchClientByPhone(decodedText);
          }
        );
      } else {
        if (html5QrCode) html5QrCode.stop();
        readerEl.style.display = 'none';
      }
    }

    async function loadClientsList() {
      const res = await fetch('/api/clients');
      const clients = await res.json();
      const tbody = document.getElementById('clientsTableBody');
      tbody.innerHTML = '';
      clients.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.name || '-'}</td>
            <td>${c.phone}</td>
            <td>${c.points}</td>
            <td>${new Date(c.created_at).toLocaleString()}</td>
          </tr>
        `;
      });
    }

    loadClientsList();
  </script>
</body>
</html>
