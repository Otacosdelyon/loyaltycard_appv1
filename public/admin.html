<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Tacos Admin - Fidélité</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .card-block {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 25px 30px;
      width: 100%;
      max-width: 850px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    h3 {
      color: #ff6600;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .input-row {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    input {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff6600;
    }

    .btn-orange {
      background: #ff6600;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }

    .btn-orange:hover {
      background: #e65c00;
    }

    .btn-dark {
      background: #333;
      color: #fff;
      border: 1px solid #444;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-dark:hover {
      background: #444;
    }

    .btn-red {
      background: #e54d4d;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-red:hover {
      background: #cc3b3b;
    }

    .info-text {
      color: #aaa;
      font-size: 13px;
      margin-top: 10px;
    }

    .scanner-box {
      border: 2px dashed #444;
      border-radius: 12px;
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      background: #181818;
    }

    .scanner-btn {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      text-align: left;
      color: #ff6600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }

    td {
      padding: 14px 0;
      border-bottom: 1px solid #262626;
      font-size: 15px;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .action-btns button {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- BLOCK 1: ENREGISTRER UN NOUVEAU CLIENT -->
  <div class="card-block">
    <h3>Enregistrer un Nouveau Client (1ère Visite)</h3>
    <div class="input-row">
      <input type="tel" id="new-phone" maxlength="8" placeholder="77111112" style="flex: 1;">
      <input type="text" id="new-name" placeholder="Nom complet (ex: Ahmed Ali Uma)" style="flex: 2;">
      <button class="btn-orange" onclick="registerClient()">Enregistrer & Générer QR</button>
    </div>
    <div class="info-text">
      ⚠️ Numéro à 8 chiffres uniquement | Nom à 3 mots minimum.
    </div>
    <p id="reg-msg" style="margin-top: 10px; font-size: 14px; font-weight: bold;"></p>
  </div>

  <!-- BLOCK 2: SCANNER QR CODE & GÉRER LES POINTS -->
  <div class="card-block">
    <h3>Scanner QR Code & Gérer les Points</h3>
    
    <div class="scanner-box">
      <button class="scanner-btn">Start Scanning</button>
      <a href="#" style="color: #4db8ff; font-size: 13px; text-decoration: underline;">Scan an Image File</a>
    </div>

    <div class="input-row">
      <input type="tel" id="scan-phone" maxlength="8" placeholder="Numéro du client (8 chiffres)" style="flex: 1;">
      <button class="btn-orange" onclick="adjustPointsDirect(10)">+10 Pts</button>
      <button class="btn-orange" onclick="adjustPointsDirect(5)">+5 Pts</button>
      <button class="btn-dark" onclick="adjustPointsDirect(-5)">-5 Pts</button>
      <button class="btn-dark" onclick="adjustPointsDirect(-10)">-10 Pts</button>
      <button class="btn-red" onclick="redeemReward()">Redeem 100 Pts!</button>
    </div>
    <p id="points-msg" style="margin-top: 10px; font-size: 14px; font-weight: bold;"></p>
  </div>

  <!-- BLOCK 3: LISTE DES CLIENTS -->
  <div class="card-block">
    <h3>Liste des Clients</h3>
    <table>
      <thead>
        <tr>
          <th>Téléphone</th>
          <th>Nom (3 Mots)</th>
          <th>Points</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="client-table-body">
        <tr>
          <td colspan="4" style="color: #777; text-align: center;">Chargement des données...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // 1. Fetch client list from /api/clients
    async function loadClients() {
      try {
        const res = await fetch('/api/clients');
        if (!res.ok) throw new Error('Échec du chargement des clients');
        const clients = await res.json();

        const tbody = document.getElementById('client-table-body');
        tbody.innerHTML = '';

        if (!clients || clients.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="color: #777; text-align: center;">Aucun client trouvé dans la base de données.</td></tr>';
          return;
        }

        clients.forEach(c => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${c.phone}</strong></td>
            <td>${c.name}</td>
            <td style="color: #ff6600; font-weight: bold;">${c.points} Pts</td>
            <td>
              <div class="action-btns">
                <button class="btn-orange" onclick="adjustByPhone('${c.phone}', 10)">+10</button>
                <button class="btn-orange" onclick="adjustByPhone('${c.phone}', 5)">+5</button>
                <button class="btn-dark" onclick="adjustByPhone('${c.phone}', -5)">-5</button>
                <button class="btn-dark" onclick="adjustByPhone('${c.phone}', -10)">-10</button>
              </div>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load clients:', err);
      }
    }

    // 2. Register Client
    async function registerClient() {
      const phone = document.getElementById('new-phone').value.trim();
      const name = document.getElementById('new-name').value.trim();
      const msg = document.getElementById('reg-msg');
      msg.innerText = '';

      try {
        const res = await fetch('/api/clients', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, name })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur lors de la création');

        msg.style.color = '#4caf50';
        msg.innerText = 'Client enregistré avec succès !';
        document.getElementById('new-phone').value = '';
        document.getElementById('new-name').value = '';
        
        loadClients();
      } catch (err) {
        msg.style.color = '#ff4d4d';
        msg.innerText = err.message;
      }
    }

    // 3. Adjust points directly from top input field
    async function adjustPointsDirect(delta) {
      const phone = document.getElementById('scan-phone').value.trim();
      if (!phone) {
        alert('Veuillez entrer un numéro de téléphone.');
        return;
      }
      await adjustByPhone(phone, delta);
    }

    // Redeem 100 Points
    async function redeemReward() {
      const phone = document.getElementById('scan-phone').value.trim();
      if (!phone) {
        alert('Veuillez entrer un numéro de téléphone.');
        return;
      }
      await adjustByPhone(phone, -100);
    }

    // 4. API call to update points
    async function adjustByPhone(phone, delta) {
      const msg = document.getElementById('points-msg');
      msg.innerText = '';

      try {
        const res = await fetch('/api/points', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, delta })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Échec de mise à jour');

        msg.style.color = '#4caf50';
        msg.innerText = `Points mis à jour ! Nouveau solde: ${data.points} Pts`;
        loadClients();
      } catch (err) {
        msg.style.color = '#ff4d4d';
        msg.innerText = err.message;
      }
    }

    // Initial load and poll every 5 seconds
    window.onload = () => {
      loadClients();
      setInterval(loadClients, 5000);
    };
  </script>
</body>
</html>
