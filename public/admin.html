<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'TACOS - Panneau d'Administration</title>
  <link rel="shortcut icon" href="otacoslogo.png" type="image/png">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121212; color: #fff; margin: 0; padding: 20px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #e5a93c; padding-bottom: 15px; margin-bottom: 20px; }
    .header-left { display: flex; align-items: center; }
    .header-left img { height: 50px; margin-right: 15px; }
    .role-select { background: #222; color: #e5a93c; border: 1px solid #e5a93c; padding: 8px; border-radius: 6px; font-weight: bold; }
    .block { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
    .block h3 { color: #e5a93c; margin-top: 0; }
    input, select { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: #fff; margin-bottom: 10px; width: 100%; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    button { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .btn-add { background: #28a745; color: #fff; }
    .btn-remove { background: #dc3545; color: #fff; }
    .btn-convert { background: #e5a93c; color: #000; width: 100%; font-size: 16px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #333; padding: 10px; text-align: left; }
    th { background: #2a2a2a; color: #e5a93c; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="otacoslogo.png" alt="O'Tacos Logo">
      <h2>Espace Admin</h2>
    </div>
    <div>
      <label>Rôle actuel : </label>
      <select id="roleSelect" class="role-select">
        <option value="supervisor">Supervisor</option>
        <option value="manager">Manager</option>
      </select>
    </div>
  </div>

  <!-- Block 1 -->
  <div class="block">
    <h3>1. Enregistrer un Nouveau Client (1ère Visite!)</h3>
    <input type="text" id="newPhone" maxlength="8" placeholder="Numéro de téléphone (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    <button class="btn-add" onclick="registerClient()">Enregistrer le Client</button>
  </div>

  <!-- Block 2 -->
  <div class="block">
    <h3>2. Scanner QR Code & Gérer les Points</h3>
    <input type="text" id="managePhone" maxlength="8" placeholder="Rechercher par Numéro (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    <button onclick="searchClient()" style="background:#007bff; color:#fff;">Charger Client</button>
    
    <div id="clientDetails" style="display:none; margin-top: 15px;">
      <p><strong>Points Actuels : </strong><span id="currentPts" style="color:#e5a93c; font-size: 20px;">0</span> Pts</p>
      
      <h4>Ajouter / Retirer des Points :</h4>
      <div class="btn-group">
        <button class="btn-add" onclick="addPts(10)">Tacos (+10 Pts)</button>
        <button class="btn-add" onclick="addPts(5)">Burger/Panini (+5 Pts)</button>
        <button class="btn-add" onclick="addPts(10)">Breakfast (+10 Pts)</button>
      </div>

      <div class="btn-group">
        <button class="btn-remove" onclick="removePts(10)">Retirer (-10 Pts)</button>
        <button class="btn-remove" onclick="removePts(5)">Retirer (-5 Pts)</button>
      </div>

      <button class="btn-convert" onclick="redeemPoints()">Convertir mes points</button>
    </div>
  </div>

  <!-- Block 3 -->
  <div class="block">
    <h3>3. Liste des Clients</h3>
    <button onclick="loadClientsList()" style="background:#6c757d; color:#fff;">Rafraîchir la Liste</button>
    <table>
      <thead>
        <tr>
          <th>Téléphone</th>
          <th>Points</th>
          <th>Date de Création</th>
        </tr>
      </thead>
      <tbody id="clientsTableBody"></tbody>
    </table>
  </div>

  <script>
    let activeClient = null;

    function getRole() {
      return document.getElementById('roleSelect').value;
    }

    async function registerClient() {
      const phone = document.getElementById('newPhone').value;
      if (phone.length !== 8) return alert('Le numéro doit comporter exactement 8 chiffres.');

      const res = await fetch('/api/clients/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      alert('Client enregistré avec succès!');
      document.getElementById('newPhone').value = '';
      loadClientsList();
    }

    async function searchClient() {
      const phone = document.getElementById('managePhone').value;
      if (phone.length !== 8) return alert('Entrez un numéro à 8 chiffres.');

      const res = await fetch(`/api/clients/${phone}`);
      if (!res.ok) {
        alert('Client introuvable.');
        return;
      }

      activeClient = await res.json();
      document.getElementById('clientDetails').style.display = 'block';
      document.getElementById('currentPts').innerText = activeClient.points;
    }

    async function addPts(pts) {
      if (!activeClient) return;
      const res = await fetch('/api/clients/add-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeClient.phone, pointsToAdd: pts })
      });
      const data = await res.json();
      if (res.ok) {
        activeClient = data.client;
        document.getElementById('currentPts').innerText = activeClient.points;
        loadClientsList();
      }
    }

    async function removePts(pts) {
      if (getRole() !== 'manager') {
        return alert('Seul le Manager est autorisé à retirer des points.');
      }
      const pin = prompt('Entrez le code PIN Manager (4 chiffres) :');
      if (!pin) return;

      const res = await fetch('/api/clients/remove-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeClient.phone, pointsToRemove: pts, pin })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      activeClient = data.client;
      document.getElementById('currentPts').innerText = activeClient.points;
      loadClientsList();
    }

    async function redeemPoints() {
      if (getRole() !== 'manager') {
        return alert('Seul le Manager est autorisé à effectuer les conversions.');
      }

      if (activeClient.points < 100) {
        const missing = 100 - activeClient.points;
        return alert(`Désolé, vous avez ${missing} points manquants.`);
      }

      const pin = prompt('Entrez le code PIN Manager (4 chiffres) :');
      if (!pin) return;

      const res = await fetch('/api/clients/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeClient.phone, pin })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      alert(data.message);
      activeClient = data.client;
      document.getElementById('currentPts').innerText = activeClient.points;
      loadClientsList();
    }

    async function loadClientsList() {
      const res = await fetch('/api/clients');
      const clients = await res.json();
      const tbody = document.getElementById('clientsTableBody');
      tbody.innerHTML = '';
      clients.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.phone}</td>
            <td>${c.points}</td>
            <td>${new Date(c.created_at).toLocaleString()}</td>
          </tr>
        `;
      });
    }

    loadClientsList();
  </script>
</body>
</html>
