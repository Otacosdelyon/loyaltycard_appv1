<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Tacos - Admin Loyalty</title>
    <style>
        :root {
            --primary-color: #D32F2F;
            --secondary-color: #333333;
            --background-color: #f4f4f4;
            --card-background: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            color: var(--secondary-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-background);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .action-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="number"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            width: 200px;
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #b71c1c;
        }

        .btn-secondary {
            background-color: #757575;
        }

        .btn-secondary:hover {
            background-color: #616161;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f0f0f0;
            color: var(--secondary-color);
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            height: 20px;
        }

        .max-reward-badge {
            background-color: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>O'Tacos - Administration Fidélité</h1>

    <!-- Quick Action Section -->
    <div class="action-card">
        <h2>Gestion des Points Client</h2>
        <div class="form-group">
            <input type="text" id="phone-input" placeholder="Numéro de téléphone" required>
            <button onclick="modifyPoints(10)">+10 Points</button>
            <button onclick="modifyPoints(-10)" class="btn-secondary">-10 Points</button>
        </div>
        <div id="status-message" class="status-msg"></div>
    </div>

    <!-- Client Directory -->
    <h2>Liste des Clients</h2>
    <table>
        <thead>
            <tr>
                <th>Téléphone</th>
                <th>Points</th>
                <th>Statut / Offre</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="clients-table-body">
            <!-- Dynamic Client Rows -->
        </tbody>
    </table>
</div>

<script>
    const API_BASE = '/api';

    // Fetch and display all clients
    async function loadClients() {
        try {
            const response = await fetch(`${API_BASE}/clients`);
            if (!response.ok) throw new Error('Erreur lors du chargement des clients');
            
            const clients = await response.json();
            const tableBody = document.getElementById('clients-table-body');
            tableBody.innerHTML = '';

            clients.forEach(client => {
                const row = document.createElement('tr');
                
                const isMax = client.points >= 100;
                const statusBadge = isMax 
                    ? '<span class="max-reward-badge">Surprise Débloquée !</span>' 
                    : 'En cours';

                row.innerHTML = `
                    <td><strong>${client.phone}</strong></td>
                    <td>${client.points} Points</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button onclick="setDirectPhone('${client.phone}', 10)">+10</button>
                        <button onclick="setDirectPhone('${client.phone}', -10)" class="btn-secondary">-10</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) {
            console.error('Erreur:', err);
            setStatus('Erreur de connexion au serveur.', 'red');
        }
    }

    // Modify points for an account
    async function modifyPoints(delta, targetPhone = null) {
        const phoneInput = document.getElementById('phone-input');
        const phone = targetPhone || phoneInput.value.trim();

        if (!phone) {
            setStatus('Veuillez entrer un numéro de téléphone valid.', 'red');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/points`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, delta })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Échec de la mise à jour');
            }

            setStatus(`Points mis à jour: ${data.phone} a maintenant ${data.points} Points`, 'green');
            if (!targetPhone) phoneInput.value = '';
            loadClients();
        } catch (err) {
            setStatus(err.message, 'red');
        }
    }

    function setDirectPhone(phone, delta) {
        document.getElementById('phone-input').value = phone;
        modifyPoints(delta, phone);
    }

    function setStatus(message, color) {
        const statusEl = document.getElementById('status-message');
        statusEl.innerText = message;
        statusEl.style.color = color === 'green' ? '#2e7d32' : '#c62828';
    }

    // Load directory on startup
    loadClients();
</script>

</body>
</html>
