<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Tacos - Admin Loyalty</title>
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-orange: #ff6600;
            --primary-orange-hover: #e65c00;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-orange);
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary-orange);
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* QR Scanner Container */
        #qr-reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
            border: 2px dashed var(--primary-orange);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .form-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        input[type="text"] {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            width: 220px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-orange);
        }

        .btn {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-orange-hover);
        }

        .btn-minus {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid var(--border-color);
        }

        .btn-minus:hover {
            background-color: #444444;
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            min-height: 24px;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 12px;
            color: var(--primary-orange);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .points-badge {
            display: inline-block;
            background-color: rgba(255, 102, 0, 0.15);
            color: var(--primary-orange);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            border: 1px solid rgba(255, 102, 0, 0.3);
        }

        .reward-unlocked {
            color: #ff6600;
            font-weight: bold;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>O'Tacos - Administration Fidélité</h1>
    </div>

    <!-- Scanner & Quick Points Section -->
    <div class="card">
        <h2>Scanner QR Code & Ajouter Points</h2>
        
        <!-- QR Code Video Region -->
        <div id="qr-reader"></div>

        <div class="form-row">
            <input type="text" id="phone-input" placeholder="Numéro de téléphone" required>
            <button class="btn" onclick="modifyPoints(10)">+10 Points</button>
            <button class="btn btn-minus" onclick="modifyPoints(-10)">-10 Points</button>
        </div>
        <div id="status-message" class="status-msg"></div>
    </div>

    <!-- Directory Section -->
    <div class="card">
        <h2>Liste des Clients</h2>
        <table>
            <thead>
                <tr>
                    <th>Téléphone</th>
                    <th>Points</th>
                    <th>Statut</th>
                    <th>Actions Rapides</th>
                </tr>
            </thead>
            <tbody id="clients-table-body">
                <!-- Dynamic Content -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = '/api';

    // Initialize QR Code Scanner
    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById('phone-input').value = decodedText;
        setStatus(`QR Code scanné: ${decodedText}`, '#ff6600');
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "qr-reader", { fps: 10, qrbox: { width: 250, height: 250 } }
    );
    html5QrcodeScanner.render(onScanSuccess);

    // Fetch and display all clients
    async function loadClients() {
        try {
            const response = await fetch(`${API_BASE}/clients`);
            if (!response.ok) throw new Error('Erreur lors du chargement');
            
            const clients = await response.json();
            const tableBody = document.getElementById('clients-table-body');
            tableBody.innerHTML = '';

            clients.forEach(client => {
                const row = document.createElement('tr');
                const isMax = client.points >= 100;
                
                const statusHtml = isMax 
                    ? '<span class="reward-unlocked">Bravo ! On débloque votre surprise aujourd\'hui ?</span>' 
                    : '<span style="color: var(--text-muted);">En cours</span>';

                row.innerHTML = `
                    <td><strong>${client.phone}</strong></td>
                    <td><span class="points-badge">${client.points} Points</span></td>
                    <td>${statusHtml}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-sm" onclick="setDirectPhone('${client.phone}', 10)">+10</button>
                            <button class="btn btn-minus btn-sm" onclick="setDirectPhone('${client.phone}', -10)">-10</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) {
            console.error('Erreur:', err);
            setStatus('Erreur de connexion au serveur.', '#f44336');
        }
    }

    async function modifyPoints(delta, targetPhone = null) {
        const phoneInput = document.getElementById('phone-input');
        const phone = targetPhone || phoneInput.value.trim();

        if (!phone) {
            setStatus('Veuillez entrer ou scanner un numéro de téléphone.', '#f44336');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/points`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, delta })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Échec de la mise à jour');
            }

            setStatus(`Points mis à jour: ${data.phone} a maintenant ${data.points} Points`, '#ff6600');
            if (!targetPhone) phoneInput.value = '';
            loadClients();
        } catch (err) {
            setStatus(err.message, '#f44336');
        }
    }

    function setDirectPhone(phone, delta) {
        document.getElementById('phone-input').value = phone;
        modifyPoints(delta, phone);
    }

    function setStatus(message, color) {
        const statusEl = document.getElementById('status-message');
        statusEl.innerText = message;
        statusEl.style.color = color;
    }

    loadClients();
</script>

</body>
</html>
