<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Tacos - Admin Loyalty</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-orange: #ff6600;
            --primary-orange-hover: #e65c00;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
            --danger-red: #d9534f;
            --danger-red-hover: #c9302c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .header h1 {
            color: var(--primary-orange);
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary-orange);
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="tel"] {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            width: 240px;
            outline: none;
        }

        input[type="text"]:focus, input[type="tel"]:focus {
            border-color: var(--primary-orange);
        }

        .btn {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-orange-hover);
        }

        .btn-minus {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid var(--border-color);
        }

        .btn-redeem {
            background-color: var(--danger-red);
            color: #ffffff;
            border: none;
        }

        .btn-redeem:hover {
            background-color: var(--danger-red-hover);
        }

        #qr-reader {
            width: 100%;
            max-width: 380px;
            margin: 0 auto 20px auto;
            border: 2px dashed var(--primary-orange);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .qr-output-card {
            text-align: center;
            display: none;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 12px;
            color: var(--primary-orange);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .points-badge {
            background-color: rgba(255, 102, 0, 0.15);
            color: var(--primary-orange);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            border: 1px solid rgba(255, 102, 0, 0.3);
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            min-height: 24px;
            margin-top: 10px;
        }

        .hint {
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>O'Tacos - Administration Fidélité</h1>
    </div>

    <!-- 1. Registration Section -->
    <div class="card">
        <h2>Enregistrer un Nouveau Client (1ère Visite)</h2>
        <div class="form-row">
            <input type="tel" id="new-phone" placeholder="Numéro (8 chiffres)" maxlength="8" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8)" required>
            <input type="text" id="new-name" placeholder="Nom complet (ex: Ahmed Ali Umar)" required>
            <button class="btn" onclick="registerClient()">Enregistrer & Générer QR</button>
        </div>
        <div class="hint">⚠️ Numéro à 8 chiffres uniquement | Nom à 3 mots minimum.</div>
        
        <!-- Generated QR Code Display -->
        <div id="qr-output" class="qr-output-card">
            <h3 style="color: var(--primary-orange); margin:0;" id="qr-client-name"></h3>
            <p style="margin: 5px 0; color: var(--text-muted);" id="qr-client-phone"></p>
            <div id="qrcode"></div>
            <p style="font-size: 0.85rem; color: #aaa;">Prenez en photo ou imprimez ce QR code pour le client.</p>
        </div>
    </div>

    <!-- 2. Point Allocation & Scanner -->
    <div class="card">
        <h2>Scanner QR Code & Gérer les Points</h2>
        <div id="qr-reader"></div>

        <div class="form-row">
            <input type="tel" id="phone-input" placeholder="Numéro du client (8 chiffres)" maxlength="8" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8)" required>
            <button class="btn" onclick="modifyPoints(10)">+10 Pts (Tacos)</button>
            <button class="btn" onclick="modifyPoints(5)">+5 Pts (Burger)</button>
            <button class="btn" onclick="modifyPoints(10)">+10 Pts (Breakfast)</button>
            <button class="btn btn-minus" onclick="modifyPoints(-5)">-5 Pts</button>
            <button class="btn btn-redeem" onclick="redeemPoints()">Redeem 100 Pts!</button>
        </div>
        <div id="status-message" class="status-msg"></div>
    </div>

    <!-- 3. Client Directory -->
    <div class="card">
        <h2>Liste des Clients</h2>
        <table>
            <thead>
                <tr>
                    <th>Téléphone</th>
                    <th>Nom (3 Mots)</th>
                    <th>Points</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="clients-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = '/api';

    // Scanner Initialization
    function onScanSuccess(decodedText) {
        const cleanPhone = decodedText.replace(/[^0-9]/g, '').slice(0, 8);
        document.getElementById('phone-input').value = cleanPhone;
        setStatus(`QR Code scanné: ${cleanPhone}`, '#ff6600');
    }
    let html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: { width: 250, height: 250 } });
    html5QrcodeScanner.render(onScanSuccess);

    // Register Client with 8 Digits + 3 Words Validation
    async function registerClient() {
        const phone = document.getElementById('new-phone').value.trim();
        const name = document.getElementById('new-name').value.trim();

        if (phone.length !== 8 || !/^\d{8}$/.test(phone)) {
            alert('ERREUR: Le numéro de téléphone doit comporter exactement 8 chiffres !');
            return;
        }

        const nameParts = name.split(/\s+/);
        if (nameParts.length < 3) {
            alert('ERREUR: Le nom doit obligatoirement comporter 3 mots ! Ex: Ahmed Ali Umar');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/clients`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, name })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            document.getElementById('qr-client-name').innerText = data.name;
            document.getElementById('qr-client-phone').innerText = `Tél: ${data.phone}`;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, { text: data.phone, width: 160, height: 160 });
            document.getElementById('qr-output').style.display = 'block';

            document.getElementById('new-phone').value = '';
            document.getElementById('new-name').value = '';
            loadClients();
        } catch (err) {
            alert(err.message);
        }
    }

    async function loadClients() {
        try {
            const response = await fetch(`${API_BASE}/clients`);
            const clients = await response.json();
            const tableBody = document.getElementById('clients-table-body');
            tableBody.innerHTML = '';

            clients.forEach(client => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${client.phone}</strong></td>
                    <td>${client.name || 'N/A'}</td>
                    <td><span class="points-badge">${client.points} Points</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn" style="padding: 4px 8px; font-size: 0.8rem;" onclick="setDirectPhone('${client.phone}', 10)">+10</button>
                            <button class="btn btn-minus" style="padding: 4px 8px; font-size: 0.8rem;" onclick="setDirectPhone('${client.phone}', -5)">-5</button>
                            <button class="btn btn-redeem" style="padding: 4px 8px; font-size: 0.8rem;" onclick="redeemPoints('${client.phone}')">Redeem 100 Pts!</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) {
            console.error(err);
        }
    }

    async function modifyPoints(delta, targetPhone = null) {
        const phone = targetPhone || document.getElementById('phone-input').value.trim();

        if (phone.length !== 8 || !/^\d{8}$/.test(phone)) {
            return setStatus('Veuillez entrer un numéro valide de 8 chiffres.', '#f44336');
        }

        try {
            const response = await fetch(`${API_BASE}/points`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, delta })
            });
            const data = await response.json();

            if (!response.ok) {
                if (data.error === 'Merci de réclamer votre surprise !') {
                    alert('Merci de réclamer votre surprise !');
                }
                throw new Error(data.error);
            }

            setStatus(`Points mis à jour pour ${data.name}: ${data.points} Points`, '#ff6600');
            if (!targetPhone) document.getElementById('phone-input').value = '';
            loadClients();
        } catch (err) {
            setStatus(err.message, '#f44336');
        }
    }

    async function redeemPoints(targetPhone = null) {
        const phone = targetPhone || document.getElementById('phone-input').value.trim();

        if (phone.length !== 8 || !/^\d{8}$/.test(phone)) {
            return setStatus('Veuillez entrer ou scanner un numéro valide de 8 chiffres.', '#f44336');
        }

        try {
            const clientCheck = await fetch(`${API_BASE}/clients/${phone}`);
            const clientData = await clientCheck.json();

            if (!clientCheck.ok) throw new Error(clientData.error);

            if (clientData.points < 100) {
                const needed = 100 - clientData.points;
                const errMsg = `Désolé vous n'avez pas assez de points pour votre surprise ! Encore ${needed} Pts à cotiser`;
                setStatus(errMsg, '#f44336');
                alert(errMsg);
                return;
            }

            if (!confirm(`Confirmer la réinitialisation (NILL) des points à 0 pour ${clientData.name} (${phone}) ?`)) {
                return;
            }

            const response = await fetch(`${API_BASE}/redeem`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            setStatus(`Récompense validée ! Points réinitialisés à 0 pour ${data.client.name}`, '#4CAF50');
            if (!targetPhone) document.getElementById('phone-input').value = '';
            loadClients();
        } catch (err) {
            setStatus(err.message, '#f44336');
        }
    }

    function setDirectPhone(phone, delta) {
        document.getElementById('phone-input').value = phone;
        modifyPoints(delta, phone);
    }

    function setStatus(msg, color) {
        const el = document.getElementById('status-message');
        el.innerText = msg;
        el.style.color = color;
    }

    loadClients();
</script>

</body>
</html>
