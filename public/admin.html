<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard & Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 900px; margin: 0 auto; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 8px; margin-top: 8px; }
    .btn-green { background: #16a34a; color: white; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-red { background: #dc2626; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Loyalty Portal</h1>

    <!-- QR Scanner Section -->
    <div class="panel">
      <h2>1. Scan Customer Card</h2>
      <div id="reader"></div>
      <div id="activeClient" style="margin-top: 15px; display: none;">
        <h3>Active Client: <span id="scannedPhone" style="color:#2563eb;"></span></h3>
        <p>Current Points: <strong id="scannedPoints" style="font-size: 20px;">0</strong></p>
        <div>
          <button class="btn btn-green" onclick="adjustPoints(2)">+2 Pts (Tacos)</button>
          <button class="btn btn-blue" onclick="adjustPoints(1)">+1 Pt (Other)</button>
          <button class="btn btn-red" onclick="adjustPoints(-10)">-10 Pts (Redeem Reward)</button>
        </div>
      </div>
    </div>

    <!-- Client Directory Section -->
    <div class="panel">
      <h2>2. Client Directory</h2>
      <input type="text" id="searchInput" placeholder="Search by phone or name..." onkeyup="filterTable()" style="padding: 8px; width: 98%; margin-bottom: 10px;">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Points</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="clientTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let activePhone = null;

    // Load clients on startup
    fetchClients();

    async function fetchClients() {
      const res = await fetch('/api/clients');
      const clients = await res.json();
      const tbody = document.getElementById('clientTableBody');
      tbody.innerHTML = '';
      clients.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.name}</td>
            <td>${c.phone}</td>
            <td><strong>${c.points}</strong></td>
            <td><button class="btn btn-blue" style="padding:4px 8px;" onclick="selectClient('${c.phone}', ${c.points})">Select</button></td>
          </tr>
        `;
      });
    }

    function selectClient(phone, points) {
      activePhone = phone;
      document.getElementById('scannedPhone').innerText = phone;
      document.getElementById('scannedPoints').innerText = points;
      document.getElementById('activeClient').style.display = 'block';
    }

    async function adjustPoints(delta) {
      if (!activePhone) return;
      const res = await fetch('/api/points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activePhone, delta })
      });
      const data = await res.json();
      document.getElementById('scannedPoints').innerText = data.points;
      fetchClients();
    }

    // QR Code Reader Integration
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render((decodedText) => {
      // Fetch scanned client info
      fetch('/api/clients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: decodedText })
      }).then(r => r.json()).then(data => {
        selectClient(data.phone, data.points);
      });
    });

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#clientTableBody tr');
      rows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
