<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'TACOS - Espace Admin</title>
  <link rel="shortcut icon" href="otacoslogo.png" type="image/png">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0d131d; color: #fff; margin: 0; padding: 20px; }
    
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #ff6600; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; }
    .header-left img { height: 50px; margin-right: 15px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .role-select { background: #192231; color: #ff6600; border: 1px solid #ff6600; padding: 8px 12px; border-radius: 8px; font-weight: bold; }

    .block { background: #192231; border: 1px solid #2c384a; border-radius: 16px; padding: 20px; margin-bottom: 25px; }
    .block h3 { color: #ff6600; margin-top: 0; border-bottom: 1px solid #2c384a; padding-bottom: 10px; }

    input, select { padding: 12px; border-radius: 8px; border: 1px solid #2c384a; background: #111722; color: #fff; font-size: 15px; }
    .full-width { width: 100%; margin-bottom: 12px; }

    /* Scanner Box Container Matching Image Layout */
    .scanner-box {
      border: 2px dashed #4a5568;
      border-radius: 12px;
      padding: 15px;
      background: #111722;
      margin-bottom: 20px;
    }
    
    /* Override html5-qrcode styles for dark theme */
    #reader { border: none !important; color: #fff; }
    #reader button { background: #ffffff; color: #000; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 5px; }
    #reader a { color: #3b82f6 !important; text-decoration: underline; }

    .action-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; }
    
    button { padding: 12px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-main { background: #ff6600; color: #fff; }
    .btn-add { background: #ff6600; color: #fff; flex: 1; }
    .btn-remove { background: #2c384a; color: #fff; flex: 1; }
    .btn-convert { background: #ef4444; color: #fff; padding: 12px 24px; font-size: 16px; border-radius: 8px; font-weight: bold; }
    .btn-logout { background: #6c757d; color: #fff; padding: 8px 14px; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #2c384a; padding: 12px; text-align: left; }
    th { background: #111722; color: #ff6600; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="otacoslogo.png" alt="O'Tacos Logo">
      <h2 style="margin:0;">Panneau Admin</h2>
    </div>
    
    <div class="header-right">
      <div>
        <label>Rôle : </label>
        <select id="roleSelect" class="role-select" onchange="handleRoleChange()">
          <option value="supervisor">Supervisor</option>
          <option value="manager">Manager</option>
        </select>
      </div>
      
      <div id="managerAuthBlock" style="display: none;">
        <span style="color: #28a745; font-weight: bold; margin-right: 5px;">🔒 Manager Connecté</span>
        <button class="btn-logout" onclick="logoutManager()">Déconnexion</button>
      </div>
    </div>
  </div>

  <!-- BLOCK 1 -->
  <div class="block">
    <h3>1. Enregistrer un Nouveau Client (1ère Visite!)</h3>
    <input type="text" id="newName" class="full-width" placeholder="Nom Complet (ex: Ahmed Ali Umar - min 3 mots)">
    <input type="text" id="newPhone" class="full-width" maxlength="8" placeholder="Numéro Téléphone (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    <button class="btn-main full-width" onclick="registerClient()">Enregistrer le Client</button>
  </div>

  <!-- BLOCK 2 -->
  <div class="block">
    <h3 style="color: #ff6600;">Scanner QR Code & Gérer les Points</h3>
    
    <!-- SCANNER CONTAINER -->
    <div class="scanner-box">
      <div id="reader"></div>
    </div>

    <!-- PHONE ENTRY & QUICK BUTTONS -->
    <div class="action-row">
      <input type="text" id="searchPhone" style="flex: 2; min-width: 200px;" maxlength="8" placeholder="Numéro du client (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
      <button class="btn-main" onclick="searchClient()">Chercher</button>
      <button class="btn-add" onclick="addPts(10)">+10 Pts</button>
      <button class="btn-add" onclick="addPts(5)">+5 Pts</button>
      <button class="btn-remove" onclick="removePts(5)">-5 Pts</button>
      <button class="btn-remove" onclick="removePts(10)">-10 Pts</button>
    </div>

    <button class="btn-convert" onclick="redeemPoints()">Redeem 100 Pts!</button>

    <div id="clientDetails" style="display:none; margin-top: 15px; background: #111722; padding: 15px; border-radius: 12px;">
      <h4 style="margin-top:0; color:#fff;" id="clientTitle">Client: </h4>
      <p style="margin:0;">Points Actuels : <strong id="currentPts" style="color:#ff6600; font-size: 22px;">0</strong> / 100 Pts</p>
    </div>
  </div>

  <!-- BLOCK 3 -->
  <div class="block">
    <h3>3. Liste des Clients</h3>
    <button onclick="loadClientsList()" style="background:#6c757d; color:#fff;">Rafraîchir la Liste</button>
    <table>
      <thead>
        <tr>
          <th>Nom Complet</th>
          <th>Téléphone</th>
          <th>Points</th>
          <th>Date de Création</th>
        </tr>
      </thead>
      <tbody id="clientsTableBody"></tbody>
    </table>
  </div>

  <script>
    let activeClient = null;

    function getRole() { return document.getElementById('roleSelect').value; }

    async function handleRoleChange() {
      if (getRole() === 'manager') {
        if (!sessionStorage.getItem('managerPin')) await promptManagerLogin();
        else document.getElementById('managerAuthBlock').style.display = 'block';
      } else {
        document.getElementById('managerAuthBlock').style.display = 'none';
      }
    }

    async function promptManagerLogin() {
      const pin = prompt('Connexion Manager : Veuillez entrer votre code PIN (4 chiffres)');
      if (!pin) { document.getElementById('roleSelect').value = 'supervisor'; return false; }

      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      });

      if (res.ok) {
        sessionStorage.setItem('managerPin', pin);
        document.getElementById('managerAuthBlock').style.display = 'block';
        alert('Connexion réussie en tant que Manager !');
        return true;
      } else {
        alert('Code PIN incorrect.');
        document.getElementById('roleSelect').value = 'supervisor';
        return false;
      }
    }

    function logoutManager() {
      sessionStorage.removeItem('managerPin');
      document.getElementById('roleSelect').value = 'supervisor';
      document.getElementById('managerAuthBlock').style.display = 'none';
    }

    // Initialize HTML5 Scanner Component directly in dashed box
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
    html5QrcodeScanner.render((decodedText) => {
      document.getElementById('searchPhone').value = decodedText;
      searchClientByPhone(decodedText);
    });

    async function registerClient() {
      const name = document.getElementById('newName').value;
      const phone = document.getElementById('newPhone').value;

      const res = await fetch('/api/clients/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone })
      });

      const data = await res.json();
      if (!res.ok) return alert(data.error);

      alert('Client enregistré avec succès!');
      document.getElementById('newName').value = '';
      document.getElementById('newPhone').value = '';
      loadClientsList();
    }

    async function searchClientByPhone(phone) {
      const res = await fetch(`/api/clients/${phone}`);
      if (!res.ok) return alert('Client introuvable.');
      
      activeClient = await res.json();
      document.getElementById('clientDetails').style.display = 'block';
      document.getElementById('clientTitle').innerText = `Client: ${activeClient.name} (${activeClient.phone})`;
      document.getElementById('currentPts').innerText = activeClient.points;
    }

    function searchClient() {
      const phone = document.getElementById('searchPhone').value;
      if (phone.length !== 8) return alert('Entrez un numéro à 8 chiffres.');
      searchClientByPhone(phone);
    }

    async function addPts(pts) {
      const phone = document.getElementById('searchPhone').value || (activeClient ? activeClient.phone : '');
      if (!phone || phone.length !== 8) return alert('Veuillez entrer ou scanner un numéro à 8 chiffres.');

      const res = await fetch('/api/clients/add-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, pointsToAdd: pts })
      });
      const data = await res.json();
      if (res.ok) {
        activeClient = data.client;
        document.getElementById('clientDetails').style.display = 'block';
        document.getElementById('clientTitle').innerText = `Client: ${activeClient.name} (${activeClient.phone})`;
        document.getElementById('currentPts').innerText = activeClient.points;
        loadClientsList();
      }
    }

    async function removePts(pts) {
      if (getRole() !== 'manager') return alert('Seul le Manager est autorisé à retirer des points.');
      
      let pin = sessionStorage.getItem('managerPin');
      if (!pin) {
        const success = await promptManagerLogin();
        if (!success) return;
        pin = sessionStorage.getItem('managerPin');
      }

      const phone = document.getElementById('searchPhone').value || (activeClient ? activeClient.phone : '');
      if (!phone || phone.length !== 8) return alert('Veuillez entrer ou scanner un numéro à 8 chiffres.');

      const res = await fetch('/api/clients/remove-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, pointsToRemove: pts, pin })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      activeClient = data.client;
      document.getElementById('clientDetails').style.display = 'block';
      document.getElementById('clientTitle').innerText = `Client: ${activeClient.name} (${activeClient.phone})`;
      document.getElementById('currentPts').innerText = activeClient.points;
      loadClientsList();
    }

    async function redeemPoints() {
      const phone = document.getElementById('searchPhone').value || (activeClient ? activeClient.phone : '');
      if (!phone || phone.length !== 8) return alert('Veuillez entrer ou scanner un numéro à 8 chiffres.');

      const res = await fetch('/api/clients/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      alert(data.message);
      activeClient = data.client;
      document.getElementById('currentPts').innerText = activeClient.points;
      loadClientsList();
    }

    async function loadClientsList() {
      const res = await fetch('/api/clients');
      const clients = await res.json();
      const tbody = document.getElementById('clientsTableBody');
      tbody.innerHTML = '';
      clients.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.name || '-'}</td>
            <td>${c.phone}</td>
            <td>${c.points} / 100</td>
            <td>${new Date(c.created_at).toLocaleString()}</td>
          </tr>
        `;
      });
    }

    loadClientsList();
  </script>
</body>
</html>
