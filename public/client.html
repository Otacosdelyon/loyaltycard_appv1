<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Tacos - Carte de Fidélité Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-orange: #ff6600;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
        }

        .header h1 {
            color: var(--primary-orange);
            font-size: 2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .client-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .client-phone {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        input[type="text"] {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            width: 65%;
            outline: none;
            text-align: center;
        }

        button {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .points-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-orange);
            margin: 15px 0;
        }

        #client-qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0 10px 0;
        }

        .reward-banner {
            display: none;
            background-color: var(--primary-orange);
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .error-msg {
            color: #f44336;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>O'Tacos Fidélité</h1>
    </div>

    <!-- Login Form -->
    <div class="card">
        <h2>Se Connecter</h2>
        <div class="form-group">
            <input type="text" id="client-phone" placeholder="Votre numéro de téléphone">
            <button onclick="fetchClientProfile()">Accéder</button>
        </div>
        <div id="error-message" class="error-msg"></div>
    </div>

    <!-- Customer Profile -->
    <div class="card" id="profile-card" style="display: none;">
        <div class="client-name" id="display-name"></div>
        <div class="client-phone" id="display-phone"></div>

        <div id="client-qrcode"></div>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Scannez ce QR Code à la caisse</p>

        <div id="points-display" class="points-display">0 Points</div>

        <div id="reward-message" class="reward-banner">
            Bravo !!! Vous avez gagné une surprise! Faites votre choix !
        </div>
    </div>
</div>

<script>
    async function fetchClientProfile() {
        const phone = document.getElementById('client-phone').value.trim();
        const errorEl = document.getElementById('error-message');
        const profileCard = document.getElementById('profile-card');
        const nameEl = document.getElementById('display-name');
        const phoneEl = document.getElementById('display-phone');
        const pointsEl = document.getElementById('points-display');
        const rewardEl = document.getElementById('reward-message');
        const qrContainer = document.getElementById('client-qrcode');

        errorEl.innerText = '';

        if (!phone) {
            errorEl.innerText = 'Veuillez entrer votre numéro de téléphone.';
            return;
        }

        try {
            const response = await fetch(`/api/clients/${phone}`);
            if (!response.ok) {
                if (response.status === 404) throw new Error('Aucun compte trouvé pour ce numéro.');
                throw new Error('Erreur de connexion au serveur.');
            }

            const data = await response.json();

            nameEl.innerText = data.name || 'Client';
            phoneEl.innerText = `Tél: ${data.phone}`;

            const points = Math.min(100, data.points);
            pointsEl.innerText = `${points} Points`;

            qrContainer.innerHTML = '';
            new QRCode(qrContainer, { text: data.phone, width: 150, height: 150 });

            profileCard.style.display = 'block';

            if (points >= 100) {
                rewardEl.style.display = 'block';
            } else {
                rewardEl.style.display = 'none';
            }
        } catch (err) {
            profileCard.style.display = 'none';
            errorEl.innerText = err.message;
        }
    }
</script>

</body>
</html>
