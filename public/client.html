<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Tacos Loyalty Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
            --success: #16a34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 4px 0;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0 0 20px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card-display {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            margin: 10px 0;
        }

        .stamp-slot {
            aspect-ratio: 1;
            border: 2px dashed var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--text-muted);
            background-color: rgba(15, 23, 42, 0.5);
            font-weight: bold;
        }

        /* Half Circle Progress (5-9 points) */
        .stamp-slot.half {
            border: 2px solid var(--gold);
            background: linear-gradient(90deg, var(--gold) 50%, rgba(15, 23, 42, 0.5) 50%);
            color: #fff;
        }

        /* Full Orange Circle (10 points) */
        .stamp-slot.full {
            border: 2px solid var(--gold);
            background-color: var(--gold);
            color: #000;
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        .points-summary {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold);
            margin: -6px 0 6px 0;
        }

        #qrcode {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
        }

        .phone-badge {
            background-color: var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .redeem-section {
            width: 100%;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-redeem {
            background-color: var(--success);
            padding: 10px;
            font-size: 0.9rem;
        }

        .btn-redeem:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .error-msg {
            color: #fca5a5;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Screen -->
    <div id="loginCard" class="card">
        <h1>O'TACOS LOYALTY</h1>
        <p class="subtitle">Enter your phone number to view your card</p>
        
        <div class="form-group">
            <input 
                type="tel" 
                id="phoneInput" 
                placeholder="77123456" 
                pattern="^77\d{6}$" 
                maxlength="8" 
                minlength="8" 
                inputmode="numeric" 
                required
            >
        </div>

        <button onclick="loadCard()">Access My Loyalty Card</button>
        <div id="errorMsg" class="error-msg" style="margin-top: 10px;"></div>
    </div>

    <!-- Active Card Screen -->
    <div id="loyaltyCard" class="card card-display">
        <h1>O'TACOS LOYALTY</h1>
        <div class="phone-badge" id="displayPhone">77XXXXXX</div>
        <div class="points-summary" id="pointsSummary">0 Points</div>

        <!-- 10 Stamp Grid -->
        <div class="stamps-grid" id="stampsGrid"></div>

        <div id="qrcode"></div>

        <!-- Redemption Options -->
        <div class="redeem-section">
            <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted); font-weight: bold;">AVAILABLE REWARDS</p>
            <button class="btn-redeem" id="btnRedeemBreakfast" onclick="redeemReward(50)">
                🎁 Redeem Free Breakfast (50 Pts)
            </button>
            <button class="btn-redeem" id="btnRedeemTacos" onclick="redeemReward(100)">
                🌮 Redeem Free Tacos (100 Pts)
            </button>
        </div>

        <button onclick="switchUser()" style="background-color: transparent; border: 1px solid var(--border); color: var(--text-muted);">
            Switch Account
        </button>
    </div>
</div>

<script>
    const loginCard = document.getElementById('loginCard');
    const loyaltyCard = document.getElementById('loyaltyCard');
    const phoneInput = document.getElementById('phoneInput');
    const displayPhone = document.getElementById('displayPhone');
    const pointsSummary = document.getElementById('pointsSummary');
    const stampsGrid = document.getElementById('stampsGrid');
    const errorMsg = document.getElementById('errorMsg');
    const btnBreakfast = document.getElementById('btnRedeemBreakfast');
    const btnTacos = document.getElementById('btnRedeemTacos');

    let currentPhone = '';
    let currentPoints = 0;

    const savedPhone = localStorage.getItem('otacos_phone');
    if (savedPhone && /^77\d{6}$/.test(savedPhone)) {
        phoneInput.value = savedPhone;
        loadCard();
    }

    async function loadCard() {
        const phone = phoneInput.value.trim();
        if (!/^77\d{6}$/.test(phone)) {
            showError('Phone number must be 8 digits starting with 77');
            return;
        }

        try {
            const res = await fetch(`/api/client/${phone}`);
            if (res.ok) {
                const client = await res.json();
                renderCard(client.phone, client.points);
            } else {
                renderCard(phone, 0);
            }
            localStorage.setItem('otacos_phone', phone);
        } catch (err) {
            renderCard(phone, 0);
        }
    }

    function renderCard(phone, points) {
        currentPhone = phone;
        currentPoints = points;

        errorMsg.style.display = 'none';
        loginCard.style.display = 'none';
        loyaltyCard.style.display = 'flex';
        displayPhone.innerText = phone;
        pointsSummary.innerText = `${points} Total Points`;

        // Render 10 circles (Each represents 10 points)
        stampsGrid.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            const slot = document.createElement('div');
            const targetPoints = i * 10;

            if (points >= targetPoints) {
                // Full 10 Points -> Orange Circle with Taco
                slot.className = 'stamp-slot full';
                slot.innerHTML = '🌮';
            } else if (points >= targetPoints - 5) {
                // Half Progress (5-9 Points) -> Half Circle
                slot.className = 'stamp-slot half';
                slot.innerHTML = i;
            } else {
                // Empty Slot
                slot.className = 'stamp-slot';
                slot.innerHTML = i;
            }
            stampsGrid.appendChild(slot);
        }

        // Enable or disable redeem buttons based on balance
        btnBreakfast.disabled = points < 50;
        btnTacos.disabled = points < 100;

        // Generate QR code
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
            text: phone,
            width: 150,
            height: 150,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    async function redeemReward(cost) {
        if (currentPoints < cost) return;

        if (!confirm(`Are you sure you want to redeem ${cost} points?`)) return;

        try {
            const res = await fetch('/api/redeem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentPhone, cost })
            });

            const data = await res.json();
            if (res.ok) {
                alert('Reward Redeemed Successfully!');
                renderCard(currentPhone, data.points);
            } else {
                alert(data.error || 'Failed to redeem reward');
            }
        } catch (err) {
            alert('Network error while redeeming reward.');
        }
    }

    function showError(msg) {
        errorMsg.innerText = msg;
        errorMsg.style.display = 'block';
    }

    function switchUser() {
        localStorage.removeItem('otacos_phone');
        loyaltyCard.style.display = 'none';
        loginCard.style.display = 'block';
        phoneInput.value = '';
    }
</script>
</body>
</html>
