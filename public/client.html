<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Tacos - Carte de Fidélité</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-orange: #ff6600;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .header h1 {
            color: var(--primary-orange);
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            margin-top: 0;
            color: var(--text-color);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        input[type="text"] {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            width: 60%;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: var(--primary-orange);
        }

        button {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #e65c00;
        }

        .earning-rules {
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary-orange);
        }

        .earning-rules h3 {
            margin-top: 0;
            color: var(--primary-orange);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .earning-rules ul {
            margin: 0;
            padding-left: 20px;
            line-height: 1.6;
            color: var(--text-color);
        }

        .points-display {
            font-size: 3.2rem;
            font-weight: bold;
            color: var(--primary-orange);
            margin: 15px 0;
        }

        .reward-banner {
            display: none;
            background-color: var(--primary-orange);
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
        }

        .error-msg {
            color: #f44336;
            font-weight: bold;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>O'Tacos Fidélité</h1>
    </div>

    <!-- Earning Rules -->
    <div class="earning-rules">
        <h3>Comment cumuler vos points ?</h3>
        <ul>
            <li><strong>Tacos:</strong> 10 Pts</li>
            <li><strong>Burger / Panini / Sandwich:</strong> 5 Pts</li>
            <li><strong>Breakfast (temporaire):</strong> 10 Pts</li>
        </ul>
    </div>

    <!-- Search / Verification Form -->
    <div class="card">
        <h2>Consulter vos points</h2>
        <div class="form-group">
            <input type="text" id="client-phone" placeholder="Numéro de téléphone">
            <button onclick="fetchClientPoints()">Voir</button>
        </div>
        <div id="error-message" class="error-msg"></div>
    </div>

    <!-- Points Card -->
    <div class="card" id="points-card" style="display: none;">
        <h2>Solde de Points</h2>
        <div id="points-display" class="points-display">0 Points</div>
        <div id="reward-message" class="reward-banner">
            Bravo !!! Vous avez gagné une surprise! Faites votre choix !
        </div>
    </div>
</div>

<script>
    async function fetchClientPoints() {
        const phoneInput = document.getElementById('client-phone');
        const phone = phoneInput.value.trim();
        const errorEl = document.getElementById('error-message');
        const pointsCard = document.getElementById('points-card');
        const pointsDisplay = document.getElementById('points-display');
        const rewardMsg = document.getElementById('reward-message');

        errorEl.innerText = '';

        if (!phone) {
            errorEl.innerText = 'Veuillez entrer un numéro de téléphone.';
            return;
        }

        try {
            const response = await fetch(`/api/clients/${phone}`);
            
            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('Aucun compte trouvé pour ce numéro.');
                }
                throw new Error('Erreur lors de la récupération des données.');
            }

            const data = await response.json();
            const points = Math.min(100, data.points);

            pointsDisplay.innerText = `${points} Points`;
            pointsCard.style.display = 'block';

            if (points >= 100) {
                rewardMsg.style.display = 'block';
            } else {
                rewardMsg.style.display = 'none';
            }
        } catch (err) {
            pointsCard.style.display = 'none';
            errorEl.innerText = err.message;
        }
    }
</script>

</body>
</html>
