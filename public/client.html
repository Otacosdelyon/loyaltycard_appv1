<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'TACOS - Ma Carte de Fidélité</title>
  <link rel="shortcut icon" href="otacoslogo.png" type="image/png">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
    .header { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 20px; }
    .header img { height: 50px; margin-right: 15px; }
    .card { background: #1e1e1e; max-width: 450px; margin: 0 auto; border-radius: 16px; padding: 25px; border: 2px solid #e5a93c; }
    .input-group { margin-bottom: 20px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; font-size: 18px; text-align: center; background: #2b2b2b; color: #fff; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #e5a93c; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
    .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin: 25px 0; }
    .stamp { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #e5a93c; position: relative; margin: 0 auto; background: #2a2a2a; overflow: hidden; }
    .stamp-fill { position: absolute; bottom: 0; left: 0; right: 0; background: #e5a93c; transition: height 0.3s ease; }
    .stamp-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; z-index: 2; text-shadow: 1px 1px 2px #000; }
    .pts-summary { font-size: 20px; font-weight: bold; color: #e5a93c; }
  </style>
</head>
<body>

  <div class="header">
    <img src="otacoslogo.png" alt="O'Tacos Logo">
    <h2>Carte de Fidélité</h2>
  </div>

  <div class="card">
    <div class="input-group">
      <input type="text" id="phoneInput" maxlength="8" placeholder="Entrez votre numéro (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
      <button onclick="loadClientCard()" style="margin-top: 10px;">Consulter mes points</button>
    </div>

    <div id="cardContent" style="display:none;">
      <div class="pts-summary" id="pointsDisplay">0 Pts</div>
      <div class="stamps-grid" id="stampsGrid"></div>
    </div>
  </div>

  <script>
    async function loadClientCard() {
      const phone = document.getElementById('phoneInput').value;
      if (phone.length !== 8) {
        alert('Veuillez entrer un numéro valide à 8 chiffres.');
        return;
      }

      const res = await fetch(`/api/clients/${phone}`);
      if (!res.ok) {
        alert('Client non trouvé.');
        return;
      }

      const data = await res.json();
      renderStamps(data.points);
    }

    function renderStamps(points) {
      document.getElementById('cardContent').style.display = 'block';
      document.getElementById('pointsDisplay').innerText = `${points} Points`;

      const grid = document.getElementById('stampsGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        // Points assigned to this stamp (10 points per stamp)
        const stampPoints = Math.max(0, Math.min(10, points - (i - 1) * 10));
        const fillPercentage = (stampPoints / 10) * 100;

        const stampEl = document.createElement('div');
        stampEl.className = 'stamp';
        stampEl.innerHTML = `
          <div class="stamp-fill" style="height: ${fillPercentage}%"></div>
          <div class="stamp-number">${i}</div>
        `;
        grid.appendChild(stampEl);
      }
    }
  </script>
</body>
</html>
