<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Tacos Loyalty Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 4px 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0 0 20px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .card-display {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            margin: 10px 0;
        }

        .stamp-slot {
            aspect-ratio: 1;
            border: 2px dashed var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            background-color: rgba(15, 23, 42, 0.5);
            transition: all 0.3s ease;
        }

        .stamp-slot.active {
            border: 2px solid var(--gold);
            background-color: var(--gold);
            color: #000;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        #qrcode {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-top: 8px;
        }

        .phone-badge {
            background-color: var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .error-msg {
            color: #fca5a5;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Login / Registration Form -->
    <div id="loginCard" class="card">
        <h1>O'TACOS LOYALTY</h1>
        <p class="subtitle">Enter your phone number to view your card</p>
        
        <div class="form-group">
            <label for="phoneInput">Phone Number (8 Digits starting with 77)</label>
            <input 
                type="tel" 
                id="phoneInput" 
                placeholder="77123456" 
                pattern="^77\d{6}$" 
                maxlength="8" 
                minlength="8" 
                inputmode="numeric" 
                required
            >
        </div>

        <button onclick="loadCard()">Access My Loyalty Card</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <!-- Active Loyalty Card Screen -->
    <div id="loyaltyCard" class="card card-display">
        <h1>O'TACOS LOYALTY</h1>
        <div class="phone-badge" id="displayPhone">77XXXXXX</div>

        <!-- 10 Stamp Grid -->
        <div class="stamps-grid" id="stampsGrid">
            <!-- Dynamically populated -->
        </div>

        <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">
            Show this QR code at checkout to earn stamps!
        </p>

        <div id="qrcode"></div>

        <button onclick="switchUser()" style="background-color: transparent; border: 1px solid var(--border); color: var(--text-muted); margin-top: 8px;">
            Switch Account
        </button>
    </div>
</div>

<script>
    const loginCard = document.getElementById('loginCard');
    const loyaltyCard = document.getElementById('loyaltyCard');
    const phoneInput = document.getElementById('phoneInput');
    const displayPhone = document.getElementById('displayPhone');
    const stampsGrid = document.getElementById('stampsGrid');
    const errorMsg = document.getElementById('errorMsg');
    let qrcodeObj = null;

    // Check if user previously logged in on this phone
    const savedPhone = localStorage.getItem('otacos_phone');
    if (savedPhone && /^77\d{6}$/.test(savedPhone)) {
        phoneInput.value = savedPhone;
        loadCard();
    }

    async function loadCard() {
        const phone = phoneInput.value.trim();
        const phoneRegex = /^77\d{6}$/;

        if (!phoneRegex.test(phone)) {
            showError('Phone number must be 8 digits starting with 77');
            return;
        }

        try {
            // Fetch current client points from backend
            const res = await fetch(`/api/clients`);
            if (res.ok) {
                const clients = await res.json();
                const matched = clients.find(c => c.phone === phone);
                renderCard(phone, matched ? matched.points : 0);
            } else {
                renderCard(phone, 0);
            }
            localStorage.setItem('otacos_phone', phone);
        } catch (err) {
            renderCard(phone, 0);
        }
    }

    function renderCard(phone, points) {
        errorMsg.style.display = 'none';
        loginCard.style.display = 'none';
        loyaltyCard.style.display = 'flex';
        displayPhone.innerText = phone;

        // Calculate current card cycle (1-10) and total rewards earned
        const currentCardPoints = points % 10 === 0 && points > 0 ? 10 : points % 10;
        const completedCards = Math.floor((points - (currentCardPoints === 10 ? 10 : currentCardPoints)) / 10);

        // Render 10 stamp slots
        stampsGrid.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            const slot = document.createElement('div');
            const isStamped = i <= currentCardPoints;
            
            slot.className = `stamp-slot ${isStamped ? 'active' : ''}`;
            slot.innerHTML = isStamped ? '🌮' : i;
            stampsGrid.appendChild(slot);
        }

        // Display total point summary and completed cards counter
        let summaryText = document.getElementById('pointSummary');
        if (!summaryText) {
            summaryText = document.createElement('p');
            summaryText.id = 'pointSummary';
            summaryText.style.cssText = 'font-weight: bold; color: var(--gold); margin: 8px 0;';
            stampsGrid.after(summaryText);
        }
        summaryText.innerText = `Total Points: ${points} pts` + (completedCards > 0 ? ` (${completedCards} Free Tacos Earned! 🎉)` : '');

        // Generate QR code for admin scanner
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        qrcodeObj = new QRCode(qrContainer, {
            text: phone,
            width: 160,
            height: 160,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function showError(msg) {
        errorMsg.innerText = msg;
        errorMsg.style.display = 'block';
    }

    function switchUser() {
        localStorage.removeItem('otacos_phone');
        loyaltyCard.style.display = 'none';
        loginCard.style.display = 'block';
        phoneInput.value = '';
    }
</script>
</body>
</html>
