<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'TACOS LOYALTY</title>
  <link rel="shortcut icon" href="otacoslogo.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      background-color: #0d131d;
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
    }
    .brand-header img { height: 60px; margin-bottom: 10px; }
    .main-title { color: #ff6600; font-size: 24px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; margin: 0; }

    .card {
      background: #192231;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    .phone-pill { background: #2c384a; color: #8fa0b5; display: inline-block; padding: 5px 15px; border-radius: 12px; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
    .client-name { font-size: 22px; font-weight: bold; margin: 5px 0; color: #ffffff; }
    .points-title { color: #ff6600; font-size: 18px; font-weight: bold; margin-bottom: 15px; }

    .reward-banner {
      background: linear-gradient(135deg, #ff6600, #e65c00);
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
      display: none;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 25px; }
    .stamp {
      width: 52px; height: 52px; border-radius: 50%; background: #4a3328; border: 2px solid #ff6600;
      display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #ff9955;
      position: relative; overflow: hidden; margin: 0 auto;
    }
    .stamp-fill { position: absolute; bottom: 0; left: 0; right: 0; background: #ff6600; transition: height 0.3s ease; }
    .stamp-num { position: absolute; z-index: 2; color: #fff; }

    .qr-container { background: #fff; border-radius: 16px; padding: 15px; display: inline-block; margin-top: 5px; }
    #qrcode img, #qrcode canvas { display: block; margin: 0 auto; }
    .qr-subtext { font-size: 13px; color: #8fa0b5; margin-top: 10px; }
    
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2c384a; background: #111722; color: #fff; font-size: 16px; text-align: center; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #ff6600; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
    
    .btn-download {
      background-color: #2c384a;
      color: #ffffff;
      margin-top: 15px;
      transition: background-color 0.2s ease;
    }
    .btn-download:hover { background-color: #3b4b63; }

    .btn-change { background: transparent; border: 1px solid #2c384a; color: #8fa0b5; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="brand-header">
    <img src="otacoslogo.png" alt="O'Tacos Logo">
    <div class="main-title">O'TACOS LOYALTY</div>
  </div>

  <div class="card">
    <div id="loginForm">
      <h3 style="margin-top:0;">Consulter ma Carte</h3>
      <input type="text" id="phoneInput" maxlength="8" placeholder="Numéro de téléphone (8 chiffres)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
      <button onclick="loadCard()">Voir mon compte</button>
    </div>

    <div id="cardContent" style="display: none;">
      <div class="phone-pill" id="displayPhone">77111113</div>
      <div class="client-name" id="displayName">Ahmed Youssouf Hadji</div>
      <div class="points-title"><span id="displayPoints">0</span> Total Points</div>

      <!-- REWARD BANNER AT 100 PTS -->
      <div class="reward-banner" id="rewardBanner">
        🎉 Félicitations ! Vous avez cumulé 100 Pts. Veuillez réclamer votre surprise à la caisse !
      </div>

      <div class="stamps-grid" id="stampsGrid"></div>

      <div class="qr-container">
        <div id="qrcode"></div>
      </div>
      <div class="qr-subtext">Scannez ce QR Code à la caisse</div>

      <!-- 💾 SAVE QR BUTTON -->
      <button class="btn-download" onclick="downloadQRCode()">💾 Sauvegarder mon QR Code</button>

      <button class="btn-change" onclick="resetCard()">Changer de compte</button>
    </div>
  </div>

  <script>
    // AUTO-LOGIN ON PAGE LOAD IF PHONE IS SAVED IN LOCALSTORAGE
    window.addEventListener('DOMContentLoaded', () => {
      const savedPhone = localStorage.getItem('otacos_phone');
      if (savedPhone && savedPhone.length === 8) {
        document.getElementById('phoneInput').value = savedPhone;
        loadCard(true); // Silent load on page open
      }
    });

    async function loadCard(isAutoLoad = false) {
      const phoneInput = document.getElementById('phoneInput');
      const phone = phoneInput.value.trim();

      if (phone.length !== 8) {
        if (!isAutoLoad) alert('Veuillez entrer un numéro à 8 chiffres.');
        return;
      }

      try {
        const res = await fetch(`/api/clients/${phone}`);
        
        // Handle non-JSON response gracefully
        const contentType = res.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          if (!isAutoLoad) alert('Impossible de se connecter au serveur. Veuillez réessayer.');
          return;
        }

        if (!res.ok) {
          const errData = await res.json();
          if (!isAutoLoad) alert(errData.error || 'Client non trouvé.');
          return;
        }

        const client = await res.json();
        
        // Save phone locally for instant future access
        localStorage.setItem('otacos_phone', client.phone);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('cardContent').style.display = 'block';

        document.getElementById('displayPhone').innerText = client.phone;
        document.getElementById('displayName').innerText = client.name || 'Client O\'Tacos';
        document.getElementById('displayPoints').innerText = client.points;

        // Show reward banner if points reach 100
        const banner = document.getElementById('rewardBanner');
        if (client.points >= 100) {
          banner.style.display = 'block';
        } else {
          banner.style.display = 'none';
        }

        renderStamps(client.points);
        generateQRCode(client.phone);

      } catch (err) {
        if (!isAutoLoad) alert('Erreur de connexion au serveur.');
      }
    }

    function renderStamps(points) {
      const grid = document.getElementById('stampsGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const stampPts = Math.max(0, Math.min(10, points - (i - 1) * 10));
        const fillHeight = (stampPts / 10) * 100;

        const stamp = document.createElement('div');
        stamp.className = 'stamp';
        stamp.innerHTML = `
          <div class="stamp-fill" style="height: ${fillHeight}%;"></div>
          <div class="stamp-num">${i}</div>
        `;
        grid.appendChild(stamp);
      }
    }

    function generateQRCode(text) {
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: text,
        width: 150,
        height: 150
      });
    }

    // FUNCTION TO DOWNLOAD / SAVE QR CODE IMAGE
    function downloadQRCode() {
      const qrContainer = document.getElementById('qrcode');
      let imageSrc = '';

      const canvas = qrContainer.querySelector('canvas');
      const img = qrContainer.querySelector('img');

      if (canvas) {
        imageSrc = canvas.toDataURL('image/png');
      } else if (img && img.src) {
        imageSrc = img.src;
      }

      if (!imageSrc) {
        alert('Veuillez d\'abord afficher votre QR Code.');
        return;
      }

      const phone = localStorage.getItem('otacos_phone') || 'carte';
      const link = document.createElement('a');
      link.href = imageSrc;
      link.download = `OTacos_QR_${phone}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function resetCard() {
      localStorage.removeItem('otacos_phone');
      document.getElementById('cardContent').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('phoneInput').value = '';
    }
  </script>
</body>
</html>
