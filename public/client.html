<!DOCTYPE html>
<html lang="fr">
<head>

  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Tacos Loyalty</title>
  
  <!-- Add your logo as the website favicon -->
  <link rel="icon" type="image/png" href="/logo.png">
</head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Tacos Loyalty</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    
    .header-title { color: #f97316; font-size: 28px; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 20px; text-transform: uppercase; }
    
    .card { background-color: #1e293b; width: 100%; max-width: 380px; border-radius: 20px; padding: 25px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; text-align: center; }
    
    .phone-badge { background-color: #334155; color: #cbd5e1; padding: 4px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .client-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: #f8fafc; }
    .points-text { font-size: 18px; font-weight: 800; color: #ea580c; margin-bottom: 20px; }
    
    /* 10 Stamp Circles Grid */
    .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; margin-bottom: 25px; }
    .stamp { aspect-ratio: 1; border-radius: 50%; background-color: #f97316; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; box-shadow: 0 0 10px rgba(249, 115, 22, 0.4); opacity: 0.25; transition: all 0.3s ease; }
    .stamp.active { opacity: 1; transform: scale(1.05); }
    
    /* QR Code Container */
    .qr-container { background-color: #ffffff; padding: 15px; border-radius: 16px; margin-bottom: 8px; }
    .qr-container img { width: 180px; height: 180px; display: block; }
    .scan-text { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
    
    /* Google Wallet Badge */
    .wallet-container { margin-bottom: 20px; }
    .wallet-btn img { height: 46px; transition: transform 0.2s ease; }
    .wallet-btn img:hover { transform: scale(1.03); }
    
    /* Reward Banner */
    .reward-banner { background-color: #ea580c; color: #ffffff; padding: 14px 15px; border-radius: 12px; font-size: 14px; font-weight: 700; width: 100%; margin-bottom: 15px; display: none; line-height: 1.4; }
    
    .logout-btn { background-color: #1e293b; border: 1px solid #334155; color: #cbd5e1; width: 100%; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s ease; }
    .logout-btn:hover { background-color: #334155; }
    
    /* Login Screen */
    .login-box { background-color: #1e293b; width: 100%; max-width: 380px; border-radius: 20px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    .input-field { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background-color: #0f172a; color: #ffffff; font-size: 16px; text-align: center; margin: 15px 0; outline: none; }
    .submit-btn { width: 100%; background-color: #ea580c; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h1 class="header-title">O'TACOS LOYALTY</h1>

  <!-- Login Form -->
  <div id="login-section" class="login-box">
    <h2 style="margin-bottom: 10px;">Espace Client</h2>
    <p style="color: #94a3b8; font-size: 14px;">Entrez votre numéro de téléphone (8 chiffres)</p>
    <input type="tel" id="phone-input" class="input-field" placeholder="Ex: 77111113" maxlength="8">
    <button onclick="loginClient()" class="submit-btn">Accéder à ma carte</button>
  </div>

  <!-- Client Loyalty Card -->
  <div id="card-section" class="card" style="display: none;">
    <div id="client-phone" class="phone-badge">77111113</div>
    <div id="client-name" class="client-name">Nom du Client</div>
    <div id="points-count" class="points-text">0 Total Points</div>

    <!-- 10 Stamps -->
    <div class="stamps-grid">
      <div class="stamp" id="stamp-1">1</div>
      <div class="stamp" id="stamp-2">2</div>
      <div class="stamp" id="stamp-3">3</div>
      <div class="stamp" id="stamp-4">4</div>
      <div class="stamp" id="stamp-5">5</div>
      <div class="stamp" id="stamp-6">6</div>
      <div class="stamp" id="stamp-7">7</div>
      <div class="stamp" id="stamp-8">8</div>
      <div class="stamp" id="stamp-9">9</div>
      <div class="stamp" id="stamp-10">10</div>
    </div>

    <!-- QR Code -->
    <div class="qr-container">
      <img id="qr-image" src="" alt="QR Code">
    </div>
    <div class="scan-text">Scannez ce QR Code à la caisse</div>

    <!-- Google Wallet Button Directly Under QR Code -->
    <div class="wallet-container">
      <a id="wallet-link" class="wallet-btn" href="#" target="_blank" style="display: none;">
        <img src="https://pay.google.com/gp/v/static/images/badges/fr_FR_add_to_google_wallet_add-to-wallet-badge.svg" alt="Ajouter à Google Wallet">
      </a>
    </div>

    <!-- 100 Pts Banner -->
    <div id="reward-banner" class="reward-banner">
      🎉 Bravo !!! Vous avez atteint 100 Pts !<br>Présentez votre QR Code pour réclamer votre surprise !
    </div>

    <button class="logout-btn" onclick="logout()">Changer de compte</button>
  </div>

  <script>
    async function loginClient() {
      const phone = document.getElementById('phone-input').value.trim();
      if (!/^\d{8}$/.test(phone)) {
        alert('Veuillez entrer un numéro valide à 8 chiffres.');
        return;
      }

      try {
        const res = await fetch(`/api/client/${phone}`);
        if (!res.ok) {
          alert('Client non trouvé.');
          return;
        }

        const data = await res.json();
        renderCard(data);
        localStorage.setItem('saved_phone', phone);
      } catch (err) {
        alert('Erreur lors du chargement des données.');
      }
    }

    function renderCard(data) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('card-section').style.display = 'flex';

      document.getElementById('client-phone').innerText = data.phone;
      document.getElementById('client-name').innerText = data.name;
      document.getElementById('points-count').innerText = `${data.points} Total Points`;

      // QR Code generation
      document.getElementById('qr-image').src = `https://quickchart.io/qr?text=${data.phone}&size=180`;

      // Activate stamp circles (1 stamp per 10 points)
      const activeStamps = Math.min(10, Math.floor(data.points / 10));
      for (let i = 1; i <= 10; i++) {
        const stamp = document.getElementById(`stamp-${i}`);
        if (i <= activeStamps) {
          stamp.classList.add('active');
        } else {
          stamp.classList.remove('active');
        }
      }

      // 100 Pts Reward Banner
      const rewardBanner = document.getElementById('reward-banner');
      if (data.points >= 100) {
        rewardBanner.style.display = 'block';
      } else {
        rewardBanner.style.display = 'none';
      }

      // Add to Google Wallet Link
      const walletLink = document.getElementById('wallet-link');
      if (data.walletUrl) {
        walletLink.href = data.walletUrl;
        walletLink.style.display = 'inline-block';
      } else {
        walletLink.style.display = 'none';
      }
    }

    function logout() {
      localStorage.removeItem('saved_phone');
      document.getElementById('card-section').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('phone-input').value = '';
    }

    // Auto-login on load
    window.onload = () => {
      const savedPhone = localStorage.getItem('saved_phone');
      if (savedPhone) {
        document.getElementById('phone-input').value = savedPhone;
        loginClient();
      }
    };
  </script>
</body>
</html>
