<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Tacos Loyalty Card</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .input-group {
      margin: 20px 0;
    }
    input {
      width: 85%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
    }
    input:focus {
      outline: none;
      border-color: #ff6600;
    }
    button.btn-primary {
      width: 92%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #ff6600;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover {
      background: #e65c00;
    }
    .points-display {
      font-size: 52px;
      font-weight: 800;
      color: #ff6600;
      margin: 10px 0 5px 0;
    }
    .progress-container {
      background: #333;
      border-radius: 10px;
      height: 14px;
      width: 100%;
      margin: 15px 0 25px 0;
      overflow: hidden;
    }
    .progress-bar {
      background: linear-gradient(90deg, #ff6600, #ff9900);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease-in-out;
    }
    .reward-banner {
      background: rgba(255, 102, 0, 0.15);
      border: 1px solid #ff6600;
      color: #ff9933;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .qr-container {
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      display: inline-block;
      margin: 15px 0;
    }
    .qr-container img {
      width: 160px;
      height: 160px;
      display: block;
    }
    #wallet-container {
      margin-top: 20px;
    }
    #wallet-btn img {
      height: 48px;
      transition: transform 0.2s;
    }
    #wallet-btn img:hover {
      transform: scale(1.05);
    }
    .btn-logout {
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
      padding: 8px 16px;
      border-radius: 6px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 12px;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="/otacoslogo.png" alt="O'Tacos Logo" class="logo">
    <h2>O'Tacos Fidélité</h2>

    <!-- LOGIN SECTION -->
    <div id="login-section">
      <p style="color: #bbb; font-size: 14px;">Entrez votre numéro à 8 chiffres</p>
      <div class="input-group">
        <input type="tel" id="phone-input" maxlength="8" placeholder="ex: 12345678" onkeypress="if(event.key==='Enter') login()">
      </div>
      <button class="btn-primary" onclick="login()">Accéder à ma carte</button>
      <p id="error-msg" style="color: #ff4d4d; font-size: 14px; margin-top: 15px;"></p>
    </div>

    <!-- CLIENT PASS / CARD SECTION -->
    <div id="card-section" class="hidden">
      <h3 id="client-name" style="margin-bottom: 5px; text-transform: capitalize;">---</h3>
      <p style="color: #aaa; font-size: 12px; margin-top: 0;">Solde de points</p>

      <div class="points-display"><span id="points-count">0</span> <span style="font-size:24px;">/ 100 Pts</span></div>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <!-- Reward Notice (Unlocked at 100 points) -->
      <div id="reward-banner" class="reward-banner hidden">
        🎉 Félicitations ! Vous avez atteint 100 points. Offre spéciale débloquée !
      </div>

      <!-- QR Code for Scanner -->
      <div class="qr-container">
        <img id="qr-code" src="" alt="Mon QR Code Client">
      </div>
      <p style="color: #888; font-size: 12px;">Présentez ce QR code en caisse</p>

      <!-- Google Wallet Pass Button -->
      <div id="wallet-container">
        <a id="wallet-btn" href="#" target="_blank" class="hidden">
          <img src="https://developers.google.com/static/wallet/images/buttons/en/add-to-google-wallet.svg" alt="Add to Google Wallet">
        </a>
      </div>

      <br>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <script>
    let activePhone = null;
    let pollTimer = null;

    async function login() {
      const phone = document.getElementById('phone-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.innerText = '';

      if (phone.length !== 8 || isNaN(phone)) {
        errorMsg.innerText = 'Veuillez entrer un numéro valide à 8 chiffres.';
        return;
      }

      activePhone = phone;
      await fetchClientData();

      // Start auto-refresh polling every 5 seconds to catch point updates live
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(fetchClientData, 5000);
    }

    async function fetchClientData() {
      if (!activePhone) return;

      try {
        const response = await fetch(`/api/client/${activePhone}`);
        if (!response.ok) {
          throw new Error('Numéro non trouvé.');
        }

        const data = await response.json();

        // Update UI Text
        document.getElementById('client-name').innerText = data.name;
        document.getElementById('points-count').innerText = data.points;

        // Update Progress Bar (Cap at 100%)
        const percentage = Math.min(Math.max((data.points / 100) * 100, 0), 100);
        document.getElementById('progress-bar').style.width = `${percentage}%`;

        // Toggle 100 Pts Reward Banner
        const rewardBanner = document.getElementById('reward-banner');
        if (data.points >= 100) {
          rewardBanner.classList.remove('hidden');
        } else {
          rewardBanner.classList.add('hidden');
        }

        // Generate QR Code via QuickChart API
        const qrImg = document.getElementById('qr-code');
        qrImg.src = `https://quickchart.io/qr?text=${encodeURIComponent(data.phone)}&size=200`;

        // Handle Google Wallet Button Link
        const walletBtn = document.getElementById('wallet-btn');
        if (data.walletUrl) {
          walletBtn.href = data.walletUrl;
          walletBtn.classList.remove('hidden');
        } else {
          walletBtn.classList.add('hidden');
        }

        // Switch to Card View
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('card-section').classList.remove('hidden');

      } catch (err) {
        document.getElementById('error-msg').innerText = err.message;
        if (pollTimer) clearInterval(pollTimer);
      }
    }

    function logout() {
      if (pollTimer) clearInterval(pollTimer);
      activePhone = null;
      document.getElementById('phone-input').value = '';
      document.getElementById('card-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }
  </script>
</body>
</html>
